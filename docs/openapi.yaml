                      type: string
                    config:
                      type: object
                      additionalProperties: true
                      description: Provider-specific credentials. Secret fields (clientSecret,
                        secretAccessKey, private_key) are AES-256-GCM encrypted
                        at rest.
                    enabled:
                      type: boolean
                    last_scan_at:
                      type:
                        - "null"
                        - string
                      format: date-time
                    last_scan_status:
                      type:
                        - "null"
                        - string
                    last_scan_total:
                      type:
                        - "null"
                        - integer
                    last_scan_error:
                      type:
                        - "null"
                        - string
                    created_at:
                      type:
                        - "null"
                        - string
                      format: date-time
                    updated_at:
                      type:
                        - "null"
                        - string
                      format: date-time
    post:
      summary: Create or upsert a cloud account
      tags:
        - Integrations
      description: On unique-key conflict (provider, name) the row is updated, not
        duplicated. Secret fields in `config` (clientSecret, secretAccessKey,
        private_key) are AES-256-GCM-encrypted before INSERT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - name
              additionalProperties: false
              properties:
                provider:
                  type: string
                  enum:
                    - aws
                    - azure
                    - gcp
                name:
                  type: string
                  minLength: 1
                config:
                  type: object
                  additionalProperties: true
                  description: "Azure: { subscriptionId, tenantId, clientId, clientSecret }. GCP:
                    { projectId, serviceAccount: <JSON string> }. AWS: {
                    accessKeyId, secretAccessKey, regions, aggregatorName,
                    aggregatorRegion }."
                enabled:
                  type: boolean
              example:
                provider: azure
                name: azure-prod
                config:
                  subscriptionId: 00000000-0000-0000-0000-000000000000
                  tenantId: 00000000-0000-0000-0000-000000000000
                  clientId: 00000000-0000-0000-0000-000000000000
                  clientSecret: REPLACE_ME
                enabled: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  id:
                    type: string
                    format: uuid
                  provider:
                    type: string
                    enum:
                      - aws
                      - azure
                      - gcp
                  name:
                    type: string
                  config:
                    type: object
                    additionalProperties: true
                    description: Provider-specific credentials. Secret fields (clientSecret,
                      secretAccessKey, private_key) are AES-256-GCM encrypted at
                      rest.
                  enabled:
                    type: boolean
                  last_scan_at:
                    type:
                      - "null"
                      - string
                    format: date-time
                  last_scan_status:
                    type:
                      - "null"
                      - string
                  last_scan_total:
                    type:
                      - "null"
                      - integer
                  last_scan_error:
                    type:
                      - "null"
                      - string
                  created_at:
                    type:
                      - "null"
                      - string
                    format: date-time
                  updated_at:
                    type:
                      - "null"
                      - string
                    format: date-time
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
