                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
    patch:
      summary: Update an API key (name / scopes / expiresAt)
      tags:
        - Admin
      description: "Updates the row metadata. The secret cannot be patched — generate
