                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum:
                      - admin
                      - write
                      - read
                expiresAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: Pass null to clear (never-expires). Pass an ISO date-time to set or
                    extend.
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  key_prefix:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
                      enum:
                        - admin
                        - write
                        - read
                  created_at:
                    type: string
                    format: date-time
                  created_by:
                    type:
                      - "null"
                      - string
                  last_used_at:
                    type:
                      - "null"
                      - string
                    format: date-time
                  revoked_at:
                    type:
                      - "null"
                      - string
                    format: date-time
                  expires_at:
                    type:
                      - "null"
                      - string
                    format: date-time
                    description: NULL = never expires; otherwise the key is rejected once now()
                      crosses this instant.
                  is_bootstrap:
                    type: boolean
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
  /admin/audit-cleanup/buffer-stats:
    get:
      summary: Audit retry-buffer state (pending + lifetime counters)
      tags:
        - Audit
      description: Snapshot of the audit() retry buffer — the in-memory queue that
        holds audit rows during a Postgres outage. Use this when debugging "why
        are some audit rows missing?" or when alerts fire on the matching
        Prometheus gauges. Admin-tier; no rate limit on this route.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: integer
                    description: Audit rows currently sitting in the retry buffer (Postgres
                      unreachable or slow). High and rising = Postgres
                      backpressure; high and flat = Postgres unavailable.
                  stats:
                    type: object
                    required:
                      - accepted
                      - flushed
                      - dropped
                      - errors
                    properties:
                      accepted:
                        type: integer
                        description: Lifetime audit() calls that the machinery accepted (regardless of
                          whether they made it to Postgres).
                      flushed:
                        type: integer
                        description: Lifetime rows successfully INSERTed.
                      dropped:
                        type: integer
                        description: Lifetime rows dropped because the retry buffer was at capacity when
                          audit() was called. Non-zero is a signal to bump
                          APPCLOUD_AUDIT_BUFFER_MAX or fix the underlying
                          Postgres outage.
                      errors:
                        type: integer
                        description: Lifetime INSERT failures (already retried via the buffer; this is
                          the failure count, not the user-visible drop count).
                    additionalProperties: false
                  skipped:
                    type: string
                    description: Set when no buffer is wired up — `no-pg` indicates the Postgres
                      plugin degraded to its stub.
                additionalProperties: false
  /admin/audit-cleanup/redistribute-default:
    post:
      summary: Redistribute audit_log_default rows into monthly partitions
      tags:
        - Audit
      description: Scans the default partition and moves rows into the partition
        matching their `created_at` month, creating new monthly partitions as
        needed. Use this once after the partitioning migration has parked old
        rows in the default, or any time pre-migration / unrouted rows
        accumulate. Admin-tier only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved:
                    type: integer
                    description: Total number of rows moved out of audit_log_default into monthly
                      partitions.
                  partitionsCreated:
                    type: array
                    items:
                      type: string
                    description: Names of partitions created by this run (audit_log_YYYY_MM).
                      Already-existing partitions are reused without
                      re-creating.
                  months:
                    type: array
                    description: Per-month breakdown so an operator can see which months held the
                      largest backlog.
                    items:
                      type: object
                      required:
                        - partition
                        - year
                        - month
                        - moved
                      properties:
                        partition:
                          type: string
                          example: audit_log_2025_11
                        year:
                          type: integer
                        month:
                          type: integer
                          minimum: 1
                          maximum: 12
                        moved:
                          type: integer
                  skipped:
                    type: string
                    description: Set when no work was done — `no-pg` (DB unavailable) or `state=<x>`
                      (audit_log not yet partitioned).
                additionalProperties: false
  /ai/status:
    get:
      summary: AI provider availability snapshot
      tags:
        - AI
      description: Returns whether the local provider (Ollama) and the cloud provider
        (Anthropic / OpenAI / Gemini / Azure) are reachable, plus model +
        baseUrl. Used by the UI to gate AI-feature affordances.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /ai/suggest/explain:
    post:
      summary: Plain-English explanation for a mapping suggestion
      tags:
        - AI
      description: Given an Infra + a candidate Component mapping (output of
        `/discovery/suggest`), the local LLM produces a human-readable
        rationale. Useful for tooltips on suggestion cards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - infra
                - suggestion
              additionalProperties: true
              properties:
                infra:
                  type: object
                  additionalProperties: true
                suggestion:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /ai/suggest/score:
    post:
      summary: AI-augmented Application/Component scoring for one Infra
      tags:
        - AI
      description: Given an Infra id, returns LLM-scored candidate Applications.
        Complements the rule-based scores from the suggest engine; clients
        combine both.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - infraId
              additionalProperties: true
              properties:
                infraId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /ai/infra/{id}/impact:
    get:
      summary: Plain-English blast-radius narrative for one Infra
      tags:
        - AI
      description: Walks the impact graph (same shape as `/graph/impact`), then asks
        the local LLM to summarise the change risk in one paragraph. Use this in
        the impact-review surface.
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /ai/architecture/plan:
    get:
      summary: High-level architectural plan over the whole graph (cloud LLM)
      tags:
        - AI
      description: Fetches a graph snapshot (apps, infra summary, cross-app
        dependencies) and asks the configured cloud LLM for an architectural
        review. Returns 503 when no cloud AI is configured.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
  /ai/drift/remediation-plan:
    post:
      summary: Remediation plan for unmapped/drifted Infra (cloud LLM)
      tags:
        - AI
      description: Without a body, picks up to 50 unmapped discovered Infra nodes and
        asks the cloud LLM to propose mappings or tag changes. With a body,
        scores the supplied items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                items:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
  /ai/dependencies/analysis:
    get:
      summary: Cross-app dependency analysis (cloud LLM)
      tags:
        - AI
      description: Pulls `/graph/topology` and asks the cloud LLM to flag risky
        dependency patterns (single points of failure, cycles, tier-skipping
        calls). Returns 503 when no cloud AI is configured.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
  /ai/chat:
    post:
      summary: Conversational chat with live graph context
      tags:
        - AI
      description: Injects a fresh snapshot of applications + infra + unmapped
        resources + cross-app deps into the system prompt before forwarding the
        conversation. Returns the assistant's reply plus a reference to the
        context used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messages
              additionalProperties: true
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    required:
                      - role
                      - content
                    additionalProperties: true
                    properties:
                      role:
                        type: string
                        enum:
                          - user
                          - assistant
                          - system
                      content:
                        type: string
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
  /metrics:
    get:
      summary: Prometheus metrics
      tags:
        - Health
      description: Plain-text Prometheus exposition for the API process. Open by
        convention — Prometheus scrapes pods over the cluster network where
        network policy provides isolation, not API keys. Audit-buffer saturation
        gauge `appcloud_audit_buffer_pending` and
        `appcloud_audit_buffer_dropped_total` are the high-leverage alert
        targets.
      security: []
      responses:
        "200":
          description: Default Response
          content:
            text/plain:
              schema:
                type: string
  /health:
    get:
      summary: Liveness probe
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Default Response
  /ready:
    get:
      summary: Readiness probe
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Default Response
  /:
    get:
      summary: API banner
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Default Response
servers:
  - url: http://localhost:3000
  - url: http://appcloud.local
security:
  - ApiKey: []
