              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /audit/actor/{name}:
    get:
      summary: All audit events by a specific actor (paginated)
      tags:
        - Audit
      description: Exact match on the `actor` column by default. Pass `?like=true` for
        case-insensitive substring (legacy behaviour, collapses across
        similarly-named keys). Optional `?keyId=<uuid>` narrows to a specific
        stored API key (exact match on actor_key_id) — preferable to
        substring-name matching once you know the key id. Optional
        `?scope=admin|write|read` narrows to one privilege tier.
      parameters:
        - schema:
            type:
              - integer
              - string
          in: query
          name: page
          required: false
        - schema:
            type:
              - integer
              - string
          in: query
          name: pageSize
          required: false
        - schema:
            type: string
            format: uuid
          in: query
          name: keyId
          required: false
        - schema:
            type: string
            enum:
              - admin
              - write
              - read
          in: query
          name: scope
          required: false
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          in: query
          name: like
          required: false
          description: Opt-in substring match (default false = exact match).
        - schema:
            type: string
            pattern: ^[A-Za-z0-9._@:+-]{1,128}$
          in: path
          name: name
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
