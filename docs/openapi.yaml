        secretAccessKey, private_key — which are decrypted on read).
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    id:
                      type: string
                      format: uuid
                    provider:
                      type: string
                      enum:
                        - aws
