  /admin/api-keys:
    post:
      summary: Create a new API key
      tags:
        - Admin
      description: Generates a fresh `ak_…` plaintext, stores SHA-256(plaintext) + the
        requested scopes, and returns the plaintext **once**. Save it
        immediately — it is never recoverable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - scopes
              additionalProperties: false
              properties:
                name:
                  type: string
                  pattern: ^[A-Za-z0-9._@:+-]{1,128}$
                  description: Human-readable identifier — appears in audit logs as the actor.
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum:
                      - admin
                      - write
                      - read
                expiresAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: Optional expiry. Omit (or pass null) for never-expires. The key
                    stops working at the moment now() crosses this instant.
              example:
                name: ci-deploy-bot
                scopes:
                  - write
                expiresAt: 2026-12-31T23:59:59Z
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  key_prefix:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
                      enum:
                        - admin
                        - write
                        - read
                  created_at:
                    type: string
                    format: date-time
                  created_by:
                    type:
                      - "null"
                      - string
                  last_used_at:
                    type:
                      - "null"
                      - string
                    format: date-time
                  revoked_at:
                    type:
                      - "null"
                      - string
                    format: date-time
                  expires_at:
                    type:
                      - "null"
                      - string
                    format: date-time
                    description: NULL = never expires; otherwise the key is rejected once now()
                      crosses this instant.
                  is_bootstrap:
                    type: boolean
                  plaintext:
                    type: string
                    description: The generated key. Shown ONCE; copy it now.
    get:
      summary: List API keys
      tags:
        - Admin
      description: Returns every row including revoked ones, sorted by creation time
        (newest first). Plaintext is **never** returned — only the prefix and
        metadata.
      parameters:
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          in: query
          name: includeRevoked
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    key_prefix:
                      type: string
                    scopes:
                      type: array
                      items:
                        type: string
                        enum:
                          - admin
                          - write
                          - read
                    created_at:
                      type: string
                      format: date-time
                    created_by:
                      type:
                        - "null"
                        - string
                    last_used_at:
                      type:
                        - "null"
                        - string
                      format: date-time
                    revoked_at:
                      type:
                        - "null"
                        - string
                      format: date-time
                    expires_at:
                      type:
                        - "null"
                        - string
                      format: date-time
                      description: NULL = never expires; otherwise the key is rejected once now()
                        crosses this instant.
                    is_bootstrap:
                      type: boolean
  /admin/api-keys/{id}:
    delete:
      summary: Revoke an API key
      tags:
        - Admin
      description: Soft-deletes the key by setting `revoked_at = now()`. Bootstrap
        rows (env-var-derived) cannot be revoked here — rotate the env var
        instead.
      parameters:
