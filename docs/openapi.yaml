openapi: 3.0.3
info:
  title: AppCloud API
  description: Knowledge graph platform for infrastructure dependency mapping and
    blast-radius analysis.
  version: 1.1.0
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas: {}
paths:
  /applications/:
    get:
      summary: List Applications
      tags:
        - Applications
      description: Returns every Application in the graph with a `componentCount` of
        contained Components, ordered by tier then name.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Stable Application UUID
                    name:
                      type: string
                      example: Payments Platform
                    tier:
                      type: integer
                      minimum: 1
                      maximum: 3
                      description: 1 = critical, 3 = best-effort
                    owner:
                      type: string
                      example: payments-team
                    environment:
                      type: string
                      example: production
                    availability:
                      type: string
                      example: "99.99"
                    confidentiality:
                      type: string
                      example: confidential
                    domain:
                      type: string
                      example: finance
                    componentCount:
                      type: integer
    post:
      summary: Create an Application
      tags:
        - Applications
      description: Creates a new Application node. `tier` is required; reasonable
        defaults are filled in for `availability` (`99.9`) and `confidentiality`
        (`internal`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - tier
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                tier:
                  type: integer
                  minimum: 1
                  maximum: 3
                owner:
                  type: string
                environment:
                  type: string
                availability:
                  type: string
                confidentiality:
                  type: string
                domain:
                  type: string
              example:
                name: Payments Platform
                tier: 1
                owner: payments-team
                environment: production
                domain: finance
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Stable Application UUID
                  name:
                    type: string
                    example: Payments Platform
                  tier:
                    type: integer
                    minimum: 1
                    maximum: 3
                    description: 1 = critical, 3 = best-effort
                  owner:
                    type: string
                    example: payments-team
                  environment:
                    type: string
                    example: production
                  availability:
                    type: string
                    example: "99.99"
                  confidentiality:
                    type: string
                    example: confidential
                  domain:
                    type: string
                    example: finance
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
  /applications/{id}:
    get:
      summary: Get one Application
      tags:
        - Applications
      description: Resolves the path param against `id` (UUID) or `name` and returns
        the Application + its Components + their owned Infra. Returns 404 when
        no match.
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: id
          required: true
          description: Resource UUID or unique name
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Stable Application UUID
                  name:
                    type: string
                    example: Payments Platform
                  tier:
                    type: integer
                    minimum: 1
                    maximum: 3
                    description: 1 = critical, 3 = best-effort
                  owner:
                    type: string
                    example: payments-team
                  environment:
                    type: string
                    example: production
                  availability:
                    type: string
                    example: "99.99"
                  confidentiality:
                    type: string
                    example: confidential
                  domain:
                    type: string
                    example: finance
                  components:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  infra:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
    patch:
      summary: Partially update an Application
      tags:
        - Applications
      description: Any subset of the create fields. Unspecified fields keep their
        existing values via `coalesce`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                tier:
                  type: integer
                  minimum: 1
                  maximum: 3
                owner:
                  type: string
                environment:
                  type: string
                availability:
                  type: string
                confidentiality:
                  type: string
                domain:
                  type: string
              example:
                name: Payments Platform
                tier: 1
                owner: payments-team
                environment: production
                domain: finance
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: id
          required: true
          description: Resource UUID or unique name
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Stable Application UUID
                  name:
                    type: string
                    example: Payments Platform
                  tier:
                    type: integer
                    minimum: 1
                    maximum: 3
                    description: 1 = critical, 3 = best-effort
                  owner:
                    type: string
                    example: payments-team
                  environment:
                    type: string
                    example: production
                  availability:
                    type: string
                    example: "99.99"
                  confidentiality:
                    type: string
                    example: confidential
                  domain:
                    type: string
                    example: finance
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
    delete:
      summary: Delete an Application (cascades exclusively-owned Components + Infra)
      tags:
        - Applications
      description: Removes the Application plus any Components that *only* belong to
        it, plus Infra that is *only* owned by those Components. Shared
        resources are preserved.
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: id
          required: true
          description: Resource UUID or unique name
      responses:
        "204":
          description: Default Response
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
  /applications/{id}/topology:
    get:
      summary: Application topology — Components, Infra, intra-app connections
      tags:
        - Applications
      description: Returns the Application, every Component it contains, the Infra
        each Component is deployed on, and Component↔Component `:CONNECTS_TO`
        edges (with protocol/port).
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: id
          required: true
          description: Resource UUID or unique name
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  application:
                    type: object
                    additionalProperties: true
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Stable Application UUID
                      name:
                        type: string
                        example: Payments Platform
                      tier:
                        type: integer
                        minimum: 1
                        maximum: 3
                        description: 1 = critical, 3 = best-effort
                      owner:
                        type: string
                        example: payments-team
                      environment:
                        type: string
                        example: production
                      availability:
                        type: string
                        example: "99.99"
                      confidentiality:
                        type: string
                        example: confidential
                      domain:
                        type: string
                        example: finance
                  components:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                          example: payment-api
                        type:
                          type: string
                          example: api
                          description: service / api / worker / database / queue / cache / frontend /
                            platform
                        runtime:
                          type:
                            - "null"
                            - string
                          example: nodejs
                        appId:
                          type:
                            - "null"
                            - string
                          description: Containing Application id (or null if unattached)
                        appName:
                          type:
                            - "null"
                            - string
                  infra:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id:
                          type: string
                          format: uuid
                        cloud_id:
                          type:
                            - "null"
                            - string
                          description: Cloud-native identifier — ARN / ARM ID / GCP self-link
                        name:
                          type: string
                        provider:
                          type: string
                          enum:
                            - aws
                            - azure
                            - gcp
                        resource_type:
                          type: string
                          example: vm
                        region:
                          type: string
                          example: eastus
                        public:
                          type: boolean
                        tags:
                          type:
                            - object
                            - string
                          description: Free-form tag map (object) or stringified JSON (legacy)
                        raw:
                          type:
                            - object
                            - string
                          description: Provider-specific payload
                  connections:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
  /applications/{id}/dependencies:
    get:
      summary: Cross-application dependencies for one Application
      tags:
        - Applications
      description: Walks each Component in the Application and lists Components in
        *other* Applications it has a `:CONNECTS_TO` edge to. Used by the
        impact-radius views.
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: id
          required: true
          description: Resource UUID or unique name
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  dependencies:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /components/metadata:
    get:
      summary: Component taxonomy + enum metadata
      tags:
        - Components
      description: Single source of truth for component types, tiers, environments,
        availability SLAs, and confidentiality levels. UI consumers fetch this
        once and hydrate dropdowns.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  componentTypes:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  tiers:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  environments:
                    type: array
                    items:
                      type: string
                  availabilitySlas:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  confidentiality:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /components/:
    get:
      summary: List Components
      tags:
        - Components
      description: Returns every Component with its containing Application (when one
        exists). Filterable via the `type` query (api / db / worker / ui).
      parameters:
        - schema:
            type: string
          in: query
          name: type
          required: false
          description: Optional filter on Component type
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                      example: payment-api
                    type:
                      type: string
                      example: api
                      description: service / api / worker / database / queue / cache / frontend /
                        platform
                    runtime:
                      type:
                        - "null"
                        - string
                      example: nodejs
                    appId:
                      type:
                        - "null"
                        - string
                      description: Containing Application id (or null if unattached)
                    appName:
                      type:
                        - "null"
                        - string
    post:
      summary: Create a Component
      tags:
        - Components
      description: Creates a Component node, optionally attaching it to an existing
        Application via `:CONTAINS`. Either `applicationId` or `appId` works
        (legacy alias).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                type:
                  type: string
                runtime:
                  type:
                    - string
                    - "null"
                applicationId:
                  type: string
                  format: uuid
                  description: Optional parent Application id
                appId:
                  type: string
                  format: uuid
                  description: Alias for applicationId
              example:
                name: payment-api
                type: api
                runtime: nodejs
                applicationId: 00000000-0000-0000-0000-000000000000
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                    example: payment-api
                  type:
                    type: string
                    example: api
                    description: service / api / worker / database / queue / cache / frontend /
                      platform
                  runtime:
                    type:
                      - "null"
                      - string
                    example: nodejs
                  appId:
                    type:
                      - "null"
                      - string
                    description: Containing Application id (or null if unattached)
                  appName:
                    type:
                      - "null"
                      - string
  /components/{id}:
    get:
      summary: Get one Component
      tags:
        - Components
      description: Returns the Component, its parent Application (or null), and the
        Infra resources it owns via `:CONNECTS_TO {via:"component-mapping"}`.
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: id
          required: true
          description: Resource UUID or unique name
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                    example: payment-api
                  type:
                    type: string
                    example: api
                    description: service / api / worker / database / queue / cache / frontend /
                      platform
                  runtime:
                    type:
                      - "null"
                      - string
                    example: nodejs
                  appId:
                    type:
                      - "null"
                      - string
                    description: Containing Application id (or null if unattached)
                  appName:
                    type:
                      - "null"
                      - string
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
    patch:
      summary: Update a Component
      tags:
        - Components
      description: Partial update on `name` / `type` / `runtime`. Other fields preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                name:
                  type: string
                type:
                  type: string
                runtime:
                  type:
                    - string
                    - "null"
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: id
          required: true
          description: Resource UUID or unique name
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                    example: payment-api
                  type:
                    type: string
                    example: api
                    description: service / api / worker / database / queue / cache / frontend /
                      platform
                  runtime:
                    type:
                      - "null"
                      - string
                    example: nodejs
                  appId:
                    type:
                      - "null"
                      - string
                    description: Containing Application id (or null if unattached)
                  appName:
                    type:
                      - "null"
                      - string
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
    delete:
      summary: Delete a Component
      tags:
        - Components
      description: "DETACH-delete: removes every relationship the Component
        participates in (including ownership and Component↔Component
        connections)."
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: id
          required: true
          description: Resource UUID or unique name
      responses:
        "204":
          description: Default Response
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
  /components/{id}/connections:
    post:
      summary: Connect this Component to another (Component → Component edge)
      tags:
        - Components
      description: Idempotently MERGEs a `:CONNECTS_TO {protocol, port}` edge from
        this Component to the target. No `via` is set — the endpoint labels
        (`:Component`→`:Component`) distinguish it from infra-side edges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetId
              additionalProperties: false
              properties:
                targetId:
                  type: string
                  format: uuid
                  description: The other Component to connect to
                protocol:
                  type: string
                  example: https
                port:
                  type:
                    - integer
                    - string
                    - "null"
              example:
                targetId: 00000000-0000-0000-0000-000000000000
                protocol: https
                port: 443
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: id
          required: true
          description: Resource UUID or unique name
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
  /components/{id}/deploy:
    post:
      summary: Deploy a Component onto an Infra (manual ownership)
      tags:
        - Components
      description: Idempotently MERGEs a `:CONNECTS_TO {via:"component-mapping",
        source:"manual-deploy", confidence:100}` edge from the Component to the
        Infra. Use this to record human-confirmed ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - infraId
              additionalProperties: false
              properties:
                infraId:
                  type: string
                  format: uuid
                  description: Infra node to MERGE a :CONNECTS_TO {via:component-mapping} edge to
              example:
                infraId: 00000000-0000-0000-0000-000000000000
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: id
          required: true
          description: Resource UUID or unique name
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployed:
                    type: boolean
  /infra/:
    get:
      summary: List Infra
      tags:
        - Infra
      description: Returns every Infra node, ordered by provider then name. Filterable
        by `provider` (aws/azure/gcp) and `public` (true/false).
      parameters:
        - schema:
            type: string
            enum:
              - aws
              - azure
              - gcp
          in: query
          name: provider
          required: false
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          in: query
          name: public
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    id:
                      type: string
                      format: uuid
                    cloud_id:
                      type:
                        - "null"
                        - string
                      description: Cloud-native identifier — ARN / ARM ID / GCP self-link
                    name:
                      type: string
                    provider:
                      type: string
                      enum:
                        - aws
                        - azure
                        - gcp
                    resource_type:
                      type: string
                      example: vm
                    region:
                      type: string
                      example: eastus
                    public:
                      type: boolean
                    tags:
                      type:
                        - object
                        - string
                      description: Free-form tag map (object) or stringified JSON (legacy)
                    raw:
                      type:
                        - object
                        - string
                      description: Provider-specific payload
    post:
      summary: Manually create an Infra node
      tags:
        - Infra
      description: Most Infra comes from discovery scans (`/discovery/scan/*`). Use
        this for resources that aren't in any cloud-API surface — e.g. an
        on-prem appliance you want represented in the graph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - provider
                - resource_type
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                provider:
                  type: string
                  enum:
