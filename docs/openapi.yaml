  /discovery/enrich/azure:
    post:
      summary: Run Azure supplement layers (Network Watcher / VM Insights / auto-link)
      tags:
        - Discovery
      description: Invokes one of the named strategies from
        `/discovery/linking-strategies` against the configured Azure account.
        Idempotent — safe to re-run. `monitor-insights` requires a Log Analytics
        workspace ID; `network-watcher` requires Network Watcher Reader.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
