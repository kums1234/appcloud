        re-derive Application/Component mappings without paying for a full scan.
        Episode-tracked.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /discovery/linking-strategies:
    get:
      summary: Linking strategy catalog (Azure)
      tags:
        - Discovery
      description: Returns the available enrichment strategies for Azure
        (resource-graph / network-watcher / monitor-insights / tagging /
        azure-arc / name-heuristics) with descriptions, required permissions,
