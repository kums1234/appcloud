                      - gcp
                  accounts:
                    type: integer
                  duration:
                    type: integer
                    description: Wall-clock ms
                  total:
                    type: integer
                    description: Sum of resource-type counts (excludes
                      edges/errors/skipped/scanEpoch)
                  breakdown:
                    type: object
                    additionalProperties: true
                    description: "Per-resource-type counts plus diagnostics. Keys vary by provider:
                      Azure=vms/aks/sql/appService/functionApp/redis/vnet,
                      GCP=instances/gke/sql/cloudRun,
                      AWS=ec2/rds/lambda/eks/ecs/alb/elasticache. Common: edges,
                      errors[], skipped[], scanEpoch."
                  stale:
                    type: object
                    additionalProperties: true
                    properties:
                      removed:
                        type: integer
                      markedStale:
                        type: integer
                      skipped:
                        type: boolean
