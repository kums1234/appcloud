      tags:
        - Audit
      description: Up to the last 500 events for one (resource_type, resource_id)
        pair, newest first. `resource_type` is one of `Application`,
        `Component`, `Infra`, `CloudAccount`, etc.
      parameters:
        - schema:
            type: string
          in: path
          name: type
          required: true
        - schema:
            type: string
          in: path
          name: id
          required: true
