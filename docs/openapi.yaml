        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                projectId:
                  type: string
                accountId:
                  type: string
                credentials:
                  type: object
                  additionalProperties: true
                  description: GCP service-account JSON contents (client_email, private_key, …)
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
