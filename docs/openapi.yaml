                    type: string
                    format: date-time
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
  /discovery/scan/all:
    post:
      summary: Scan every configured cloud account in parallel
      tags:
        - Discovery
      description: Fans out to `scanAWS` / `scanAzure` / `scanGCP` for every enabled
        account configured at `/integrations/cloud`. Bootstrap runs once at the
        end; cleanup is per-provider. The single response covers all three
        clouds with per-account breakdowns under `results.<provider>[]`.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  duration:
                    type: integer
                  total:
                    type: integer
                  providers:
                    type: array
                    items:
                      type: string
                  results:
                    type: object
                    additionalProperties: true
                  errors:
                    type: object
                    additionalProperties: true
                  stale:
                    type: object
                    additionalProperties: true
                  bootstrap:
                    type:
                      - "null"
                      - object
                    additionalProperties: true
                  completedAt:
                    type: string
                    format: date-time
  /discovery/schedule:
    get:
      summary: Current discovery scheduler state
      tags:
        - Discovery
      description: Returns the cron-style schedule plus the last-run / next-run
        timestamps. The scheduler runs every enabled provider in parallel.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      summary: Set the discovery scheduler
      tags:
        - Discovery
      description: "Replaces the schedule with `{ enabled, cron }`. The cron string is
        standard 5-field; consult any cron reference. Setting `enabled: false`
        disables future runs without deleting the config."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                enabled:
                  type: boolean
                cron:
                  type: string
                  example: 0 */6 * * *
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /discovery/schedule/run-now:
    post:
      summary: Trigger the scheduled scan immediately
      tags:
        - Discovery
      description: Equivalent to `POST /discovery/scan/all` but uses the same code
        path the scheduler does (so it picks up the same accounts + flags).
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /discovery/debug/{id}:
    get:
      summary: Per-resource debug dump (admin + APPCLOUD_DEBUG only)
      tags:
        - Discovery
      description: Returns the Infra node plus every `:CONNECTS_TO` edge it
        participates in (incoming and outgoing), with full edge properties. Use
        this to understand why the suggest engine made a particular call.
        **Admin-tier only**, and in production must also have `APPCLOUD_DEBUG=1`
        set.
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: id
          required: true
          description: Resource UUID or unique name
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /discovery/suggest:
    get:
      summary: Pull the suggest engine's current output
      tags:
        - Discovery
      description: For every unmapped Infra, returns up to 5 ranked Component
        candidates with rule names + scores. Drives the mapping-suggestions UI.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /discovery/suggest/apply:
    post:
      summary: Apply a batch of confirmed mappings (legacy single-action endpoint)
      tags:
        - Discovery
      description: Each mapping creates a `:CONNECTS_TO {via:"component-mapping",
        source:"auto-mapped"}` edge. For mixed-action batches (link +
        create-component + create-application), use
        `/discovery/suggest/apply-all`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mappings
              additionalProperties: true
              properties:
                mappings:
                  type: array
                  items:
                    type: object
                    required:
                      - infraId
                      - componentId
                    additionalProperties: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /discovery/suggest/apply-all:
    post:
      summary: Apply a mixed-action batch from the suggest engine
      tags:
        - Discovery
      description: >-
        Three action shapes share one endpoint:

        - `link_component` — link existing Component to existing Infra

        - `create_component` — create a Component under an existing Application
        + link

        - `create_application` — create Application + Component(s) + link


        Phase 2 also runs after the batch: tag-based auto-link sweeps any
        still-unmapped Infra against the newly-created components.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - actions
              additionalProperties: false
              properties:
                actions:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required:
                      - action
                    additionalProperties: false
                    properties:
                      action:
                        type: string
                        enum:
                          - link_component
                          - create_component
                          - create_application
                      infraId:
                        type: string
                      componentId:
                        type: string
                      applicationId:
                        type: string
                      newAppName:
                        type: string
                      newCompName:
                        type: string
                      suggestedTier:
                        type: integer
                        minimum: 1
                        maximum: 3
                      suggestedEnv:
                        type: string
                      suggestedOwner:
                        type: string
                      suggestedType:
                        type: string
                      components:
                        type: array
