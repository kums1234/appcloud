  /audit/:
    get:
      summary: Paginated audit log
      tags:
        - Audit
      description: "Every mutation API call writes a row here. `actor` is exact-match
        by default — pass `?like=true` to opt into the legacy substring/ILIKE
        behaviour (separate keys with similar names like `ci-deploy-staging` /
        `ci-deploy-prod` previously collapsed into one query, which is now
        opt-in). Other filters: `action`, `resourceType`, `resourceId`, `keyId`
        (exact UUID), `scope` (admin|write|read), `from`/`to` (ISO date), `q`
        (substring on `resource_name` OR `actor`). Returns `{ rows, total, page,
        pageSize, pages }`. Each row includes `actorKeyId` and `actorScope` so a
        row can be traced back to the specific API key that performed the
        action."
      parameters:
        - schema:
            type:
              - integer
              - string
          in: query
          name: page
          required: false
        - schema:
            type:
              - integer
              - string
          in: query
          name: pageSize
          required: false
        - schema:
            type: string
          in: query
          name: action
          required: false
        - schema:
            type: string
          in: query
          name: resourceType
          required: false
        - schema:
            type: string
          in: query
          name: resourceId
          required: false
        - schema:
            type: string
          in: query
          name: actor
          required: false
          description: Exact match by default. Set `like=true` for case-insensitive
            substring (legacy).
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          in: query
          name: like
          required: false
          description: Opt-in substring match for `actor` (default false = exact match).
        - schema:
            type: string
            format: uuid
          in: query
          name: keyId
          required: false
          description: Exact match on actor_key_id — see GET /admin/api-keys for ids.
        - schema:
            type: string
            enum:
              - admin
              - write
              - read
          in: query
          name: scope
          required: false
        - schema:
            type: string
            format: date-time
          in: query
          name: from
          required: false
        - schema:
            type: string
            format: date-time
          in: query
          name: to
          required: false
        - schema:
            type: string
          in: query
          name: q
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /audit/stats:
    get:
      summary: Audit-log analytics for the last N days
      tags:
        - Audit
      description: Returns counts grouped by action / resource_type / actor plus a
        daily-activity series for sparklines. Default window is 30 days; pass
        `?days=N` to widen.
