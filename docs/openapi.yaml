      tags:
        - Integrations
      description: For graphs that pre-date the Postgres backing store. Idempotent
        (`ON CONFLICT (provider, name) DO UPDATE`). Returns the count of
        accounts migrated.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /integrations/cloud/{id}/scan-result:
    patch:
      summary: Internal — record a scan outcome on a cloud account
      tags:
        - Integrations
      description: Called by the scan handlers in discovery.js to stamp `last_scan_at
        / last_scan_status / last_scan_total / last_scan_error` on the account
        row. Not typically called directly by external consumers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                status:
                  type: string
                  enum:
                    - success
                    - error
                total:
                  type: integer
                error:
                  type:
                    - string
                    - "null"
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: id
          required: true
          description: Resource UUID or unique name
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: boolean
  /integrations/ai:
    get:
      summary: Get the active cloud-AI provider configuration
      tags:
        - Integrations
      description: "Returns the saved Anthropic / OpenAI / Gemini / Azure-OpenAI
        config with `apiKey` masked. Returns `{ configured: false }` when no
        config exists."
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      summary: Save (upsert) the cloud-AI provider configuration
      tags:
        - Integrations
      description: Replaces any existing config (only one active at a time). `apiKey`
        is AES-256-GCM-encrypted before INSERT. Setting Azure also requires
        `azureEndpoint` and `azureDeployment`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - apiKey
              additionalProperties: true
              properties:
                provider:
                  type: string
                  enum:
                    - anthropic
                    - openai
                    - gemini
                    - azure
                apiKey:
                  type: string
                model:
                  type: string
                  default: auto
                azureEndpoint:
                  type: string
                azureDeployment:
                  type: string
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      summary: Delete the saved cloud-AI provider configuration
      tags:
        - Integrations
      description: After deletion `fastify.ai.refreshCloudFromDb()` clears the
        in-memory provider so subsequent `/ai/*` routes return 503 until a new
        config is saved.
      responses:
        "204":
          description: Default Response
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /integrations/ai/test:
    post:
      summary: Test the saved cloud-AI configuration
      tags:
        - Integrations
      description: 'Sends a trivial "Reply with exactly: OK" message and returns the
        provider response. Useful for verifying credentials without spending
        tokens on a real query.'
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /integrations/:
    get:
      summary: List configured connector instances
      tags:
        - Integrations
      description: Returns every row from the `integrations` table — ServiceNow,
        Terraform Cloud, OTel ingest, IaC state backends, etc. Secret fields are
        decrypted; client UIs are responsible for further obscuring.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    post:
      summary: Create a connector instance
      tags:
        - Integrations
      description: "Body shape: `{ type, name, config, enabled?, pollIntervalSeconds?
        }`. The `type` must match a registered connector (`/connectors`); the
        connector's `beforeUpsert` runs before validation to fill defaults /
        auto-generate secrets, and `afterUpsert` runs after persist to sync
        derived rows. Secret fields are AES-256-GCM-encrypted before INSERT."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - name
              additionalProperties: true
              properties:
                type:
                  type: string
                  description: Connector id (e.g. servicenow, terraform-cloud, otel-ingest)
                name:
                  type: string
                config:
                  type: object
                  additionalProperties: true
                enabled:
                  type: boolean
                  default: true
                pollIntervalSeconds:
                  type:
                    - integer
                    - "null"
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /integrations/{id}:
    get:
      summary: Get one connector instance
      tags:
        - Integrations
      description: Returns the integration row with config decrypted. Use
        `/connectors/:type` for the connector's schema and capabilities.
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    patch:
      summary: Update a connector instance (partial)
      tags:
        - Integrations
      description: Patches `config` (merged + re-encrypted), `enabled`, or
        `pollIntervalSeconds`. The connector's before/afterUpsert hooks run on
        each update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                config:
                  type: object
                  additionalProperties: true
                enabled:
                  type: boolean
                pollIntervalSeconds:
                  type:
                    - integer
                    - "null"
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      summary: Delete a connector instance
      tags:
        - Integrations
      description: Removes the row. Resources the connector previously ingested into
        Neo4j stay; the next discovery sweep / cleanupStaleNodes will mark them
        stale.
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          in: path
          name: id
          required: true
      responses:
        "204":
          description: Default Response
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /integrations/{id}/test:
    post:
      summary: Test a connector's healthCheck
      tags:
        - Integrations
      description: Invokes `spec.healthCheck()` against the live integration. Returns
        `{ ok, detail }`. Cheap — does not ingest anything.
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /integrations/{id}/scan:
    post:
      summary: Trigger a one-off ingest pass
      tags:
        - Integrations
      description: Runs `fetch → normalize → ingest` for the connector and records a
        `sync_jobs` row with the outcome. Returns the result envelope
        (resourcesFound / created / updated / warnings).
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /integrations/{id}/history:
    get:
      summary: Connector instance sync history
      tags:
        - Integrations
      description: Returns up to 50 of the most recent `sync_jobs` rows for this
        integration with status, durations, and per-status counts. Use this to
        debug why an ingest didn't produce the expected nodes.
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /connectors/:
    get:
      summary: List available connectors (registry)
      tags:
        - Connectors
      description: Returns every connector registered with the framework — ServiceNow,
        Terraform Cloud, OTel ingest, IaC state backends. Each entry includes
        its `authSchema`, `configSchema`, and UI metadata. Use this to render
        dynamic connector-creation forms.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /connectors/{id}:
    get:
      summary: Get one connector's schema
      tags:
        - Connectors
      description: Returns the full spec for one connector — `id`, `displayName`,
        `description`, JSON schemas for auth + config, UI metadata,
        capabilities. Used by the connector-creation UI to drive a form.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /discovery/scan/aws:
    post:
      summary: Scan AWS via Config aggregator
      tags:
        - Discovery
      description: Pages every aggregated resource via `SelectAggregateResourceConfig`
        and writes Infra + structural `:CONNECTS_TO` edges. With a body, runs a
        one-off scan against the supplied credentials; without one, scans every
        enabled AWS account from `/integrations/cloud`. Requires
        `aggregatorName` + `aggregatorRegion` (or `AWS_CONFIG_AGGREGATOR_NAME`
        env var). See
        [docs/aws-config-aggregator-coverage.md](../docs/aws-config-aggregator-coverage.md).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                regions:
                  type: array
                  items:
                    type: string
                accountId:
                  type: string
                  description: When set, only scan this configured account
                credentials:
                  type: object
                  additionalProperties: true
                  properties:
                    accessKeyId:
                      type: string
                    secretAccessKey:
                      type: string
                    sessionToken:
                      type: string
                    aggregatorName:
                      type: string
                    aggregatorRegion:
                      type: string
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  provider:
                    type: string
                    enum:
                      - aws
                      - azure
                      - gcp
                  accounts:
                    type: integer
                  duration:
                    type: integer
                    description: Wall-clock ms
                  total:
                    type: integer
                    description: Sum of resource-type counts (excludes
                      edges/errors/skipped/scanEpoch)
                  breakdown:
                    type: object
                    additionalProperties: true
                    description: "Per-resource-type counts plus diagnostics. Keys vary by provider:
                      Azure=vms/aks/sql/appService/functionApp/redis/vnet,
                      GCP=instances/gke/sql/cloudRun,
                      AWS=ec2/rds/lambda/eks/ecs/alb/elasticache. Common: edges,
                      errors[], skipped[], scanEpoch."
                  stale:
                    type: object
                    additionalProperties: true
                    properties:
                      removed:
                        type: integer
                      markedStale:
                        type: integer
                      skipped:
                        type: boolean
                      errors:
                        type: array
                        items:
                          type: string
                  bootstrap:
                    type:
                      - "null"
                      - object
                    additionalProperties: true
                  enrichment:
                    type:
                      - "null"
                      - object
                    additionalProperties: true
                  completedAt:
                    type: string
                    format: date-time
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                  - message
                additionalProperties: true
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: infraId required
  /discovery/scan/azure:
    post:
      summary: Scan Azure via Resource Graph
