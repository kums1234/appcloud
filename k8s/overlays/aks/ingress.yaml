apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appcloud
  namespace: appcloud
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    # If using nginx ingress controller instead:
    # kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod   # optional, remove if not using cert-manager
spec:
  tls:
    - hosts:
        - appcloud.yourdomain.com
      secretName: appcloud-tls
  rules:
    - host: appcloud.yourdomain.com    # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 4000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
