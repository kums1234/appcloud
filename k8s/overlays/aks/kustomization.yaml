apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: appcloud

resources:
  - ../../base
  - ingress.yaml
  - hpa.yaml

# Images pulled from ACR — replace myregistry with your ACR name
images:
  - name: appcloud-api
    newName: appcloudregistry.azurecr.io/appcloud-api
    newTag: latest

patches:
  # AKS managed-csi StorageClass (Azure Disk) — scoped per PVC to avoid
  # corrupting unrelated resources with an unscoped patch.
  - patch: |-
      - op: add
        path: /spec/storageClassName
        value: managed-csi
    target:
      kind: PersistentVolumeClaim
      name: neo4j-data

  - patch: |-
      - op: add
        path: /spec/storageClassName
        value: managed-csi
    target:
      kind: PersistentVolumeClaim
      name: postgres-data

  # ollama-data PVC is excluded — already bound in cluster without a
  # StorageClassName and Kubernetes forbids changing spec on bound PVCs.