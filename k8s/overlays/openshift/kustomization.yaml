apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: appcloud

resources:
  - ../../base
  - route-api.yaml
  - hpa.yaml


# Images pulled from OpenShift internal registry or Quay.io
images:
  - name: appcloud-api
    newName: image-registry.openshift-image-registry.svc:5000/appcloud/appcloud-api
    newTag: latest

# scc-patch.yaml is a strategic-merge patch, not a standalone resource,
# so it belongs here rather than under resources:. Kustomize refuses to
# "merge" two Deployments with the same name when both live in resources:
# (the symptom was the accumulation error we saw on `kubectl kustomize`).
patches:
  - path: scc-patch.yaml
  # OpenShift default StorageClass
  - patch: |-
      - op: add
        path: /spec/storageClassName
        value: gp2
    target:
      kind: PersistentVolumeClaim
