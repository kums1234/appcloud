apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appcloud
  namespace: appcloud
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: appcloud.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 4000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
