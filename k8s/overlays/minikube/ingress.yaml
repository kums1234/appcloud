apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appcloud
  namespace: appcloud
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: appcloud.local
      http:
        paths:
          # UI — root path
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ui
                port:
                  number: 4000
          # API — /api prefix stripped before forwarding
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 3000
---
# Separate ingress for Neo4j browser on its own hostname
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appcloud-neo4j
  namespace: appcloud
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: neo4j.appcloud.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neo4j
                port:
                  number: 7474
