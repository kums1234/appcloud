apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: appcloud

resources:
  - ../../base
  - ingress.yaml


# Point to locally built images (minikube image load)
images:
  - name: appcloud-api
    newName: appcloud-api
    newTag: latest

patches:
  # Use 'standard' StorageClass (minikube default)
  - patch: |-
      - op: add
        path: /spec/storageClassName
        value: standard
    target:
      kind: PersistentVolumeClaim
      name: neo4j-data
  - patch: |-
      - op: add
        path: /spec/storageClassName
        value: standard
    target:
      kind: PersistentVolumeClaim
      name: postgres-data
  # Single replica for local dev
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: api
  # Tighten resource limits for local machine
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
    target:
      kind: Deployment
      name: neo4j

  # Never pull from registry — use images loaded via minikube image load
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: api

  # Use Recreate strategy on minikube — rolling updates need spare node capacity
  # that a single-node local cluster often doesn't have
  - patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
    target:
      kind: Deployment
      name: api
  # Lower resource requests for local dev
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
    target:
      kind: Deployment
      name: api

  - patch: |-
      - op: add
        path: /spec/storageClassName
        value: standard
    target:
      kind: PersistentVolumeClaim
      name: ollama-models

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "5Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
    target:
      kind: Deployment
      name: ollama
