apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: appcloud
  labels:
    app: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ui
    spec:
      enableServiceLinks: false
      containers:
        - name: ui
          image: appcloud-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://api:3000
            - name: PORT
              value: "4000"
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
