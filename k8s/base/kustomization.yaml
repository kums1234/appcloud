apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: appcloud

resources:
  - namespace.yaml
  - neo4j-configmap.yaml
  - neo4j-pvc.yaml
  - postgres-pvc.yaml
  - neo4j-deployment.yaml
  - neo4j-service.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - api-deployment.yaml
  - api-pdb.yaml
  - api-service.yaml
  - ollama-deployment.yaml
  - ollama-service.yaml
  - ollama-pvc.yaml

# Postgres init SQL lives here so kustomize security rules are satisfied
# (files must be within or below the kustomization directory)
configMapGenerator:
  - name: postgres-init
    files:
      - postgres-init/01-schema.sql
      - postgres-init/03-audit-indexes.sql
      - postgres-init/07-integrations-evolution.sql
      - postgres-init/08-otel-staging.sql
      - postgres-init/09-cmdb-assessment.sql
    options:
      disableNameSuffixHash: true
