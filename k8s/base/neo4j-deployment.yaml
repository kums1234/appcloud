apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: appcloud
  labels:
    app: neo4j
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      # Prevent Kubernetes from injecting service discovery env vars into this
      # pod. Neo4j 5.x strict config validation rejects unknown env vars like
      # PORT_7687_TCP_PORT that Kubernetes auto-generates for every service.
      enableServiceLinks: false
      initContainers:
        - name: fix-entrypoint
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /scripts/neo4j-entrypoint.sh /entrypoint/neo4j-entrypoint.sh
              chmod 755 /entrypoint/neo4j-entrypoint.sh
              echo "Entrypoint ready:"
              ls -la /entrypoint/
          volumeMounts:
            - name: entrypoint-script
              mountPath: /scripts
            - name: entrypoint-exec
              mountPath: /entrypoint
      containers:
        - name: neo4j
          image: neo4j:5.18
          command: ["/entrypoint/neo4j-entrypoint.sh"]
          ports:
            - name: http
              containerPort: 7474
            - name: bolt
              containerPort: 7687
          env:
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_dbms_memory_pagecache_size
              value: "512M"
            - name: NEO4J_dbms_memory_heap_max__size
              value: "512M"
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "apoc.*"
            - name: NEO4J_dbms_security_procedures_allowlist
              value: "apoc.*"
            # Disable strict validation as a safety net — prevents crashes from
            # any unrecognised env vars that slip through
            - name: NEO4J_server_config_strict__validation_enabled
              value: "false"
            - name: DB_USERNAME_FILE
              value: /run/secrets/db_username
            - name: DB_PASSWORD_FILE
              value: /run/secrets/db_password
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
            - name: entrypoint-exec
              mountPath: /entrypoint
            - name: db-credentials
              mountPath: /run/secrets/db_username
              subPath: db_username
              readOnly: true
            - name: db-credentials
              mountPath: /run/secrets/db_password
              subPath: db_password
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "1.5Gi"
              cpu: "1000m"
      volumes:
        - name: neo4j-data
          persistentVolumeClaim:
            claimName: neo4j-data
        - name: entrypoint-script
          configMap:
            name: neo4j-entrypoint
            defaultMode: 0755
        - name: entrypoint-exec
          emptyDir: {}
        - name: db-credentials
          secret:
            secretName: appcloud-db-credentials
