apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: appcloud
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      enableServiceLinks: false
      # Pod-level hardening: refuse to run as root, drop the kernel
      # capability bag we don't need, and read-only the root FS so a
      # post-exploitation foothold can't drop binaries. The container
      # writes only to /tmp (mounted as emptyDir below) — see Dockerfile
      # USER directive for the matching uid/gid.
      securityContext:
        runAsNonRoot: true
        runAsUser:    10001
        runAsGroup:   10001
        fsGroup:      10001
      containers:
        - name: api
          image: appcloud-api:latest    # overridden per overlay with registry path
          # Always pull on rolling deploys — `:latest` + IfNotPresent
          # would silently keep stale images on nodes that already have
          # one. Per-environment overlays should pin to immutable tags
          # (`:sha-…`) and switch this back to IfNotPresent for the
          # bandwidth saving.
          imagePullPolicy: Always
          # Container-level hardening. readOnlyRootFilesystem is
          # deliberately false here — Node's open-source CA chain and
          # fastify's request-scoped scratch space write to a few paths
          # we haven't audited yet. Set to true once tested + an
          # emptyDir is mounted at /tmp.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APPCLOUD_NEO4J_URI
              value: bolt://neo4j:7687
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              value: appcloud
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: OLLAMA_MODEL
              value: llama3
            - name: DB_USERNAME_FILE
              value: /run/secrets/db_username
            - name: DB_PASSWORD_FILE
              value: /run/secrets/db_password
            - name: PG_USERNAME_FILE
              value: /run/secrets/pg_username
            - name: PG_PASSWORD_FILE
              value: /run/secrets/pg_password
            - name: APPCLOUD_API_KEY_FILE
              value: /run/secrets/appcloud_api_key
            # Bootstrap super-admin key — needed for cross-tenant ops
            # (POST /admin/tenants, agents/seed.js). Created by an
            # operator one-off:
            #   openssl rand -hex 32 > /tmp/sa.key
            #   kubectl -n appcloud create secret generic \
            #     appcloud-super-admin-api-key \
            #     --from-file=appcloud_super_admin_api_key=/tmp/sa.key
            - name: APPCLOUD_SUPER_ADMIN_API_KEY_FILE
              value: /run/secrets/appcloud_super_admin_api_key
            - name: APPCLOUD_ENCRYPTION_KEY_FILE
              value: /run/secrets/appcloud_encryption_key
          volumeMounts:
            - name: db-username
              mountPath: /run/secrets/db_username
              subPath: db_username
              readOnly: true
            - name: db-password
              mountPath: /run/secrets/db_password
              subPath: db_password
              readOnly: true
            - name: pg-username
              mountPath: /run/secrets/pg_username
              subPath: pg_username
              readOnly: true
            - name: pg-password
              mountPath: /run/secrets/pg_password
              subPath: pg_password
              readOnly: true
            - name: appcloud-api-key
              mountPath: /run/secrets/appcloud_api_key
              subPath: appcloud_api_key
              readOnly: true
            - name: appcloud-super-admin-api-key
              mountPath: /run/secrets/appcloud_super_admin_api_key
              subPath: appcloud_super_admin_api_key
              readOnly: true
            - name: appcloud-encryption-key
              mountPath: /run/secrets/appcloud_encryption_key
              subPath: appcloud_encryption_key
              readOnly: true
          # /ready probes Postgres + Neo4j connectivity per request and
          # returns 503 when either is unreachable. K8s removes the pod
          # from service endpoints while degraded, then re-adds when the
          # probe goes green again — no pod restart required.
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          # /health stays green even when DBs are degraded so K8s doesn't
          # kill (and recreate) a pod that just needs traffic re-routed.
          # Restart the pod only on hard liveness failures (process hang).
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              # Bumped from 512Mi: Node.js API carries AWS + Azure + GCP SDKs
              # plus the IaC connector framework (S3/Azure-Blob/GCS SDKs) and
              # the OTel aggregator — 512Mi was tripping the OOM killer during
              # cold boot once the full stack loaded. 1Gi was over the
              # minikube node's headroom (with Neo4j/Postgres/Ollama also
              # scheduled); 768Mi is the middle ground.
              memory: "768Mi"
              cpu: "500m"
      volumes:
        - name: db-username
          secret:
            secretName: appcloud-db-credentials
        - name: db-password
          secret:
            secretName: appcloud-db-credentials
        - name: pg-username
          secret:
            secretName: appcloud-pg-credentials
        - name: pg-password
          secret:
            secretName: appcloud-pg-credentials
        - name: appcloud-api-key
          secret:
            secretName: appcloud-api-key
        - name: appcloud-super-admin-api-key
          secret:
            secretName: appcloud-super-admin-api-key
        - name: appcloud-encryption-key
          secret:
            secretName: appcloud-encryption-key
