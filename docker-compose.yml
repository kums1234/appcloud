version: '3.8'

services:
  # ── Neo4j — graph topology & relationships ──────────────────────────────────
  db:
    image: neo4j:latest
    container_name: appcloud-db
    ports:
      - "7474:7474"
      - "7687:7687"
    entrypoint: ["/entrypoint/neo4j-entrypoint.sh"]
    environment:
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_max__size=512M
      - DB_USERNAME_FILE=/run/secrets/db_username
      - DB_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - ./data/db/data:/data
      - ./data/db/config:/config
      - ./data/db/plugins:/plugins
      - ./data/db/logs:/logs
      - ./neo4j-entrypoint.sh:/entrypoint/neo4j-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $(cat /run/secrets/db_username) -p $(cat /run/secrets/db_password) 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    secrets:
      - db_username
      - db_password
    restart: unless-stopped

  # ── PostgreSQL — users, audit logs, sync history, reporting ─────────────────
  postgres:
    image: postgres:16-alpine
    container_name: appcloud-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=appcloud
      - POSTGRES_USER_FILE=/run/secrets/pg_username
      - POSTGRES_PASSWORD_FILE=/run/secrets/pg_password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/pg_username) -d appcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    secrets:
      - pg_username
      - pg_password
    restart: unless-stopped

  # ── Ollama ──────────────────────────────────────────────────────────────────
  # Uses LOCAL Ollama (not containerised) to avoid Docker OOM.
  # Start Ollama on your Mac:  ollama serve
  # Pull a model:              ollama pull qwen2.5:14b
  # The API container reaches it via host.docker.internal:11434.

  # ── Fastify API ──────────────────────────────────────────────────────────────
  api:
    build: ./api
    container_name: appcloud-api
    ports:
      - "3000:3000"
    environment:
      - NEO4J_URI=bolt://db:7687
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=appcloud
      - PORT=3000
      - HOST=0.0.0.0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:14b
      - DB_USERNAME_FILE=/run/secrets/db_username
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - PG_USERNAME_FILE=/run/secrets/pg_username
      - PG_PASSWORD_FILE=/run/secrets/pg_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - JWT_EXPIRES_IN=8h
    secrets:
      - db_username
      - db_password
      - pg_username
      - pg_password
      - jwt_secret
    volumes:
      - ./api/src:/app/src
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

secrets:
  db_username:
    file: ./secrets/db_username.txt
  db_password:
    file: ./secrets/db_password.txt
  pg_username:
    file: ./secrets/pg_username.txt
  pg_password:
    file: ./secrets/pg_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt