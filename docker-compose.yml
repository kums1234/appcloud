version: '3.8'

services:
  db:
    image: neo4j:latest
    container_name: appcloud-db
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    # Custom entrypoint reads secret files and sets NEO4J_AUTH before Neo4j starts.
    entrypoint: ["/entrypoint/neo4j-entrypoint.sh"]
    environment:
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_max__size=512M
      - DB_USERNAME_FILE=/run/secrets/db_username
      - DB_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - ./data/db/data:/data
      - ./data/db/config:/config
      - ./data/db/plugins:/plugins
      - ./data/db/logs:/logs
      - ./neo4j-entrypoint.sh:/entrypoint/neo4j-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $(cat /run/secrets/db_username) -p $(cat /run/secrets/db_password) 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    secrets:
      - db_username
      - db_password
    restart: unless-stopped

  api:
    build: ./api
    container_name: appcloud-api
    ports:
      - "3000:3000"
    environment:
      - NEO4J_URI=bolt://db:7687
      - PORT=3000
      - HOST=0.0.0.0
      - DB_USERNAME_FILE=/run/secrets/db_username
      - DB_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_username
      - db_password
    volumes:
      - ./api/src:/app/src
      - ./api/node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build: ./ui
    container_name: appcloud-ui
    ports:
      - "4000:4000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:3000
    depends_on:
      - api
    restart: unless-stopped

secrets:
  db_username:
    file: ./secrets/db_username.txt
  db_password:
    file: ./secrets/db_password.txt