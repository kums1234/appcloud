# docker-compose.dev.yml
# Development override for docker-compose.yml
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

version: '3.8'

services:
  # ── Fastify API (Development Mode) ──────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    volumes:
      - ./api/src:/app/src:ro
      - ./api/__tests__:/app/__tests__:ro
      - ./api/package.json:/app/package.json:ro
      - ./api/package-lock.json:/app/package-lock.json:ro
      - /app/node_modules  # Named volume to avoid host node_modules conflicts
    environment:
      - NODE_ENV=development
      # Dev keys are sourced from .env.local (gitignored). Run `cp .env.local.example
      # .env.local` and edit. The `:?` syntax aborts compose with a helpful error if
      # they're unset, which is safer than silently falling back to a known-weak
      # default that anyone reading the repo could exploit.
      - APPCLOUD_API_KEY=${APPCLOUD_API_KEY:?set APPCLOUD_API_KEY in .env.local — see .env.local.example}
      - APPCLOUD_ENCRYPTION_KEY=${APPCLOUD_ENCRYPTION_KEY:?set APPCLOUD_ENCRYPTION_KEY in .env.local — see .env.local.example}
    env_file:
      - path: .env.local
        required: false
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ── Neo4j (Development Mode) ────────────────────────────────────────────────
  db:
    environment:
      - NEO4J_dbms_memory_pagecache_size=256M
      - NEO4J_dbms_memory_heap_max__size=256M

  # ── PostgreSQL (Development Mode) ───────────────────────────────────────────
  postgres:
    environment:
      - POSTGRES_DB=appcloud_dev